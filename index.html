<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>El Camino al Cole &mdash; Aventura Andina</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="stage">
    <canvas id="game" width="384" height="216"></canvas>
    <div id="boot">
      <div class="boot-inner">
        <h1>EL CAMINO AL COLE</h1>
        <p class="sub">Aventura Andina</p>
        <p class="hint" id="bootHint">Cargando&hellip;</p>
      </div>
    </div>
  </div>

  <div id="touch" aria-hidden="true">
    <button class="tbtn" id="tLeft"  data-key="left">&#9664;</button>
    <button class="tbtn" id="tRight" data-key="right">&#9654;</button>
    <button class="tbtn" id="tDown"  data-key="down">&#9660;</button>
    <button class="tbtn tbtn-a" id="tJump" data-key="jump">A</button>
  </div>

<script src="js/pixel.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/level.js"></script>
<script src="js/entities.js"></script>
<script src="js/game.js"></script>
</body>
</html>
