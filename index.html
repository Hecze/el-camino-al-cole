<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>La Maratón de los Andes</title>
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="ranking-api" content="https://maraton-andes-api.haroldmedrano33.workers.dev" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="stage">
    <canvas id="game" width="384" height="216"></canvas>
    <div id="boot">
      <div class="boot-inner">
        <h1>LA MARATÓN DE LOS ANDES</h1>
        <p class="sub">Llega al cole antes de las 8:00</p>
        <p class="hint" id="bootHint">Cargando&hellip;</p>
      </div>
    </div>
  </div>

  <div id="touch" aria-hidden="true">
    <button class="tbtn" id="tLeft"  data-key="left">&#9664;</button>
    <button class="tbtn" id="tRight" data-key="right">&#9654;</button>
    <button class="tbtn" id="tDown"  data-key="down">&#9660;</button>
    <button class="tbtn tbtn-a" id="tJump" data-key="jump">A</button>
  </div>

<script src="js/pixel.js"></script>
<script src="js/font.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/level.js"></script>
<script src="js/entities.js"></script>
<script src="js/cap2.js"></script>
<script src="js/cap3.js"></script>
<script src="js/ranking.js"></script>
<script src="js/game.js"></script>
</body>
</html>
